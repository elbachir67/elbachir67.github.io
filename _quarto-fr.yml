# Profil français (US-36) : pages à la racine, sortie dans _site.
lang: fr

project:
  output-dir: _site
  render:
    - "**/*.qmd"
    # Les pages anglaises sont rendues par le profil « en » (exclusion par dossier : un nom court
    # comme « !index.qmd » exclurait aussi en/index.qmd).
    - "!en/**"

website:
  description: "Site académique d'El Hadji Bassirou Touré, Maître de Conférences Titulaire au DMI/FST/UCAD : recherche, publications, enseignement et CV."
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: recherche/index.qmd
        text: Recherche
      - href: publications/index.qmd
        text: Publications
      - href: enseignement/index.qmd
        text: Enseignement
      - href: blog/index.qmd
        text: Blog
      - href: cv/index.qmd
        text: CV
    right:
      # Sélecteur de langue : rel="alternate" sert de repère au script assets/js/bascule-langue.js,
      # qui remplace la cible par la page équivalente. Sans JavaScript, le lien mène à l'accueil anglais.
      - href: /en/
        text: English
        rel: alternate
  page-footer:
    left: "© 2026 El Hadji Bassirou Touré · DMI/FST/UCAD"
    right: >-
      [{{< ai google-scholar >}}](https://scholar.google.com/citations?user=JsZhGvQAAAAJ){aria-label="Google Scholar"}
      [{{< ai orcid >}}](https://orcid.org/0009-0008-8554-8425){aria-label="ORCID"}
      [<i class="bi bi-github" aria-hidden="true"></i>](https://github.com/elbachir67){aria-label="GitHub"}
