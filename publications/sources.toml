# Publications à citer sur le site : entrée de scripts/publications.py (voir README.md).
#
# Source : liste « Publications (8) » de _specs/contenus/sprint-02-sources.md, extraite du CV du PO.
# Ne rien ajouter qui ne soit pas publié (CLAUDE.md, règle « Travaux non acceptés »).
#
# Champs d'une publication :
#   cle        identifiant stable : clé BibTeX et ancre de la page (publications/#cle). Minuscules,
#              chiffres et tirets, sans année. Ne plus le modifier une fois publié : d'autres
#              pages (Research) pointent vers ces ancres ;
#   titre      titre donné par la source, qui sert à retrouver la notice dans Crossref ;
#   event_year année de la conférence, donnée par la source : classe la publication sur la page ;
#   evenement  conférence et année, telles que données par la source (affichées sur la page) ;
#   lieu       ville de la conférence, telle que donnée par la source (affichée sur la page) ;
#   pages      (facultatif) pages données par la source, pour départager des notices homonymes ;
#   statut     (facultatif) « a-paraitre » : publication acceptée, sans DOI, affichée « (à paraître) » ;
#              tout autre statut que « publie » ou « a-paraitre » exclut la publication de la page ;
#   auteurs    (à paraître) auteurs « Nom, Initiales », utilisés tant que Crossref n'a pas de notice ;
#   editeur    (à paraître) éditeur annoncé des actes ; absent, il est écrit « TODO(PO): … ».
#
# Auteurs, DOI, titre publié, actes, éditeur, pages et année de publication viennent de Crossref.
# Une publication à paraître est complétée par Crossref dès que sa notice existe (même recherche par titre).
# L'année de publication reste dans le .bib (year) ; la page classe par année de conférence (eventdate).

# Nom du PO : mis en gras sur la page, et rétabli quand une notice l'abrège ou omet l'accent.
