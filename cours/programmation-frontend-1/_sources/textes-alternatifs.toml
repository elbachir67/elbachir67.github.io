# Textes alternatifs des figures qui n'ont pas de légende dans le .tex, validés par le PO.
#
# Un brouillon (US-58) ne suffit pas : rien n'arrive ici sans que le PO l'ait accepté,
# corrigé ou réécrit. Le manifeste dit, figure par figure, laquelle de ces trois.

01-le-web-et-html-01 = "À gauche, votre navigateur (Chrome, Firefox), à Dakar sur votre PC ; à droite, le serveur, un ordinateur quelque part dans le monde. Une flèche va du navigateur au serveur : « 1. Donne-moi la page ucad.sn » ; une autre revient : « 2. Voici le code HTML »."
01-le-web-et-html-02 = "Arbre d'une page HTML : <html> a deux enfants, <head> et <body>. <head> contient <title> et <meta> ; <body> contient <h1>, <p> et <img>."
02-css-01 = "La page d'accueil de Jàng Afrig, deux fois côte à côte. Sans CSS : titre, liens soulignés et liste à puces des cinq modes de jeu, en noir sur blanc. Avec CSS : un bandeau coloré pour le titre, une barre de navigation, des titres en couleur et les cinq modes de jeu en boutons."
02-css-02 = "La règle h1 { color: red; } annotée : h1 est le sélecteur, color la propriété, red la valeur. Les accolades ouvrent et ferment le bloc, et le point-virgule marque la fin de la propriété."
02-css-03 = "Deux règles empilées, p { color: red; } puis p { color: blue; } : la plus basse gagne, et le résultat affiché est bleu."
02-css-04 = "Le box model en rectangles emboîtés : margin à l'extérieur, puis border, puis padding, et content au centre."
02-css-05 = "Un conteneur Flexbox et ses quatre éléments, numérotés de 1 à 4 et alignés en ligne. L'axe principal, horizontal, est piloté par justify-content ; l'axe secondaire, vertical, par align-items."
04-le-web-moderne-01 = "Votre page (le navigateur) envoie une requête GET, fetch(url), à l'API REST Countries (serveur distant), qui répond par des données JSON."
05-deploiement-et-demo-01 = "Votre dépôt jang-afrig (branche main) ; on active GitHub Pages, qui publie le site à une URL publique en …github.io/, accessible partout, sur ordinateurs et téléphones."
