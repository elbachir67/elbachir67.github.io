# Métadonnées du cours (US-14) : seule source pour la fiche de la page du cours et pour la carte du
# catalogue. Un cours décrit ici n'est pas répété dans enseignement/cours.yml.
#
# Le titre, le domaine et le niveau viennent du catalogue, où le PO les avait posés. Le semestre,
# les prérequis et les objectifs sont ceux du plan du cours (_import/frontend1/Plan_Cours_JangAfrig.tex,
# « Informations pratiques » et « Ce que vous saurez faire à la fin du cours »), mot pour mot :
# décision du PO, 11/10.

titre: "Programmation Frontend 1 : HTML, CSS, JavaScript"
domaine: "Programmation, Web & Mobile"
niveaux: ["L1"]
semestre: "S2"
statut: "en-ligne"
skill: "njurelgeo-web-fundamentals"
prerequis:
  - "Algorithmique du S1"
  - "Savoir utiliser un ordinateur"
objectifs:
  - "Écrire une page web complète en HTML5 (structure, sémantique, formulaires, tableaux)"
  - "Mettre en forme une page avec CSS3 (sélecteurs, box model, Flexbox, responsive mobile)"
  - "Programmer en JavaScript moderne (variables, fonctions, tableaux, objets, forEach, map, filter)"
  - "Modifier le contenu d'une page depuis JavaScript (DOM et événements)"
  - "Récupérer des données d'une API distante avec fetch et async/await"
  - "Sauvegarder des données dans le navigateur (localStorage)"
  - "Versionner votre code avec Git et le partager sur GitHub"
  - "Déployer une application web en ligne sur GitHub Pages"

# Ressource du cours entier, et non d'une séance : le plan couvre les quinze séances (décision du PO).
ressources:
  - type: "pdf"
    fichier: "ressources/plan-du-cours.pdf"
    titre: "Plan du cours"
    chemin: "/cours/programmation-frontend-1/ressources/plan-du-cours.pdf"
