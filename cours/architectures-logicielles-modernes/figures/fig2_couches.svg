<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="inherit">
  <defs>
    <marker id="fig2_couches-fleche2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="500" fill="none" />

  
  <rect x="180" y="40" width="420" height="70" rx="8" fill="#3a52a8" />
  <text x="390" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Couche Presentation</text>
  <text x="390" y="90" text-anchor="middle" font-size="12" fill="white">SenRestoController : routes HTTP, DTOs, codes de statut</text>

  <line x1="390" y1="110" x2="390" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#fig2_couches-fleche2)" />

  
  <rect x="180" y="150" width="420" height="90" rx="8" fill="#ea7d2b" />
  <text x="390" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Couche Service</text>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="white">CommandeService, RestaurantService, LivreurService</text>
  <text x="390" y="220" text-anchor="middle" font-size="12" fill="white">validation, regles metier, transitions de statut, calculs</text>

  <line x1="390" y1="240" x2="390" y2="270" stroke="currentColor" stroke-width="2.5" marker-end="url(#fig2_couches-fleche2)" />

  
  <rect x="180" y="280" width="420" height="90" rx="8" fill="#7a3a9c" />
  <text x="390" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Couche Repository</text>
  <text x="390" y="330" text-anchor="middle" font-size="12" fill="white">CommandeRepository, RestaurantRepository, LivreurRepository</text>
  <text x="390" y="350" text-anchor="middle" font-size="12" fill="white">tout le SQL, et rien que le SQL</text>

  <line x1="390" y1="370" x2="390" y2="400" stroke="currentColor" stroke-width="2.5" marker-end="url(#fig2_couches-fleche2)" />

  
  <rect x="290" y="410" width="200" height="50" rx="8" fill="currentColor" />
  <text x="390" y="441" text-anchor="middle" font-size="14" font-weight="bold" fill="white">BDD (H2 / PostgreSQL)</text>

  
  <line x1="120" y1="70" x2="120" y2="420" stroke="#3aa84d" stroke-width="2.5" marker-end="url(#fig2_couches-fleche2)" />
  <text x="60" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#3aa84d" transform="rotate(-90 60 240)">dependances a sens unique</text>

  
  <rect x="620" y="150" width="130" height="220" rx="8" fill="none" stroke="#3aa84d" stroke-width="2" />
  <text x="685" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#3aa84d">La regle d'or</text>
  <text x="685" y="205" text-anchor="middle" font-size="11" fill="currentColor">une couche ne</text>
  <text x="685" y="222" text-anchor="middle" font-size="11" fill="currentColor">connait que la</text>
  <text x="685" y="239" text-anchor="middle" font-size="11" fill="currentColor">couche juste</text>
  <text x="685" y="256" text-anchor="middle" font-size="11" fill="currentColor">en dessous,</text>
  <text x="685" y="280" text-anchor="middle" font-size="11" fill="currentColor">jamais celle</text>
  <text x="685" y="297" text-anchor="middle" font-size="11" fill="currentColor">du dessus, ni</text>
  <text x="685" y="314" text-anchor="middle" font-size="11" fill="currentColor">deux niveaux</text>
  <text x="685" y="331" text-anchor="middle" font-size="11" fill="currentColor">plus bas</text>

  
  <text x="390" y="484" text-anchor="middle" font-size="13" fill="currentColor">Chaque couche a une seule responsabilite : on peut la comprendre, la modifier et la tester seule.</text>
</svg>
