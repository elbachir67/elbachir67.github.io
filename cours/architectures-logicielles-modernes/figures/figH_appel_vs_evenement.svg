<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="inherit">
  <defs>
    <marker id="figH_appel_vs_evenement-fh" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="currentColor" />
    </marker>
    <marker id="figH_appel_vs_evenement-fho" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#ea7d2b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="440" fill="none" />

  
  <text x="215" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">Appel direct (synchrone)</text>
  <text x="215" y="56" text-anchor="middle" font-size="11" fill="currentColor">quand la reponse est necessaire tout de suite</text>

  <rect x="60" y="90" width="150" height="60" rx="8" fill="#ea7d2b" />
  <text x="135" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="white">commandes</text>
  <text x="135" y="134" text-anchor="middle" font-size="10" fill="white">confirmer()</text>

  <rect x="260" y="90" width="150" height="60" rx="8" fill="#3a52a8" />
  <text x="335" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="white">livraison</text>
  <text x="335" y="134" text-anchor="middle" font-size="10" fill="white">AssignationLivreurs</text>

  <line x1="210" y1="110" x2="256" y2="110" stroke="currentColor" stroke-width="2.5" marker-end="url(#figH_appel_vs_evenement-fh)" />
  <line x1="256" y1="132" x2="210" y2="132" stroke="currentColor" stroke-width="2.5" marker-end="url(#figH_appel_vs_evenement-fh)" />
  <text x="233" y="100" text-anchor="middle" font-size="10" fill="currentColor">appelle</text>
  <text x="233" y="148" text-anchor="middle" font-size="10" fill="currentColor">repond</text>

  <text x="215" y="196" text-anchor="middle" font-size="11" fill="currentColor">le client attend le nom du livreur et l'ETA</text>
  <text x="215" y="214" text-anchor="middle" font-size="11" fill="currentColor">dans la reponse HTTP : il FAUT une reponse</text>
  <text x="215" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc1f1f">couplage assume : commandes connait livraison</text>

  
  <line x1="430" y1="46" x2="430" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="6,5" />

  
  <text x="645" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea7d2b">Evenement interne (publier / ecouter)</text>
  <text x="645" y="56" text-anchor="middle" font-size="11" fill="currentColor">quand on informe sans attendre de reponse</text>

  <rect x="470" y="90" width="150" height="60" rx="8" fill="#ea7d2b" />
  <text x="545" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="white">commandes</text>
  <text x="545" y="134" text-anchor="middle" font-size="10" fill="white">publie et continue</text>

  <rect x="545" y="186" width="200" height="44" rx="8" fill="none" stroke="#ea7d2b" stroke-width="2" stroke-dasharray="7,4" />
  <text x="645" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea7d2b">CommandeConfirmee</text>
  <text x="645" y="222" text-anchor="middle" font-size="10" fill="#ea7d2b">(record, evenement metier)</text>

  <line x1="565" y1="150" x2="600" y2="182" stroke="#ea7d2b" stroke-width="2.5" marker-end="url(#figH_appel_vs_evenement-fho)" />

  <rect x="470" y="280" width="150" height="60" rx="8" fill="#7a3a9c" />
  <text x="545" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="white">paiement</text>
  <text x="545" y="324" text-anchor="middle" font-size="10" fill="white">@EventListener</text>

  <rect x="660" y="280" width="150" height="60" rx="8" fill="currentColor" />
  <text x="735" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="white">notifications</text>
  <text x="735" y="324" text-anchor="middle" font-size="10" fill="white">@EventListener</text>

  <line x1="600" y1="234" x2="558" y2="276" stroke="#ea7d2b" stroke-width="2.5" marker-end="url(#figH_appel_vs_evenement-fho)" />
  <line x1="690" y1="234" x2="726" y2="276" stroke="#ea7d2b" stroke-width="2.5" marker-end="url(#figH_appel_vs_evenement-fho)" />

  <text x="645" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#3aa84d">decouplage : commandes ignore qui ecoute</text>
  <text x="645" y="398" text-anchor="middle" font-size="11" fill="currentColor">ajouter un abonne = zero modification de commandes</text>

  <text x="430" y="428" text-anchor="middle" font-size="13" fill="currentColor">Deux outils, deux usages — et au Lab 5, ces memes evenements traverseront le reseau via RabbitMQ.</text>
</svg>
