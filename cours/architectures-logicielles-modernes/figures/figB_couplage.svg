  <text x="275" y="217" text-anchor="middle" font-size="13" fill="currentColor">D</text>

  
  <line x1="170" y1="82" x2="230" y2="82" stroke="#D9822B" stroke-width="2" />
  <line x1="170" y1="212" x2="230" y2="212" stroke="#D9822B" stroke-width="2" />
  <line x1="125" y1="104" x2="125" y2="190" stroke="#D9822B" stroke-width="2" />
  <line x1="275" y1="104" x2="275" y2="190" stroke="#D9822B" stroke-width="2" />
  <line x1="170" y1="95" x2="200" y2="95" stroke="#D9822B" stroke-width="2" />
  <line x1="200" y1="95" x2="200" y2="200" stroke="#D9822B" stroke-width="2" />
  <line x1="200" y1="200" x2="230" y2="200" stroke="#D9822B" stroke-width="2" />
  <line x1="170" y1="225" x2="200" y2="225" stroke="#D9822B" stroke-width="2" />
  <line x1="200" y1="225" x2="200" y2="240" stroke="#D9822B" stroke-width="2" />
  <line x1="200" y1="240" x2="240" y2="240" stroke="#D9822B" stroke-width="2" />
  <line x1="240" y1="240" x2="240" y2="234" stroke="#D9822B" stroke-width="2" />

  <text x="200" y="285" text-anchor="middle" font-size="12" fill="currentColor">tout depend de tout :</text>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="currentColor">toucher A, c'est risquer B, C et D</text>

  
  <line x1="400" y1="40" x2="400" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="6,5" />

  
  <text x="600" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E8B57">Couplage faible</text>

  <rect x="480" y="60" width="90" height="44" rx="6" fill="none" stroke="#2E8B57" stroke-width="2" />
  <text x="525" y="87" text-anchor="middle" font-size="13" fill="currentColor">A</text>
  <rect x="630" y="60" width="90" height="44" rx="6" fill="none" stroke="#2E8B57" stroke-width="2" />
  <text x="675" y="87" text-anchor="middle" font-size="13" fill="currentColor">B</text>
  <rect x="480" y="190" width="90" height="44" rx="6" fill="none" stroke="#2E8B57" stroke-width="2" />
  <text x="525" y="217" text-anchor="middle" font-size="13" fill="currentColor">C</text>
  <rect x="630" y="190" width="90" height="44" rx="6" fill="none" stroke="#2E8B57" stroke-width="2" />
  <text x="675" y="217" text-anchor="middle" font-size="13" fill="currentColor">D</text>

  
  <line x1="570" y1="82" x2="630" y2="82" stroke="#2E8B57" stroke-width="2" />
  <line x1="525" y1="104" x2="525" y2="190" stroke="#2E8B57" stroke-width="2" />

  <text x="600" y="285" text-anchor="middle" font-size="12" fill="currentColor">des interfaces minimales :</text>
  <text x="600" y="304" text-anchor="middle" font-size="12" fill="currentColor">toucher A ne concerne que ses voisins declares</text>
