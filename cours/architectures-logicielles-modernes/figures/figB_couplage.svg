<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="inherit">
  <rect x="0" y="0" width="800" height="340" fill="none" />

  
  <text x="200" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9822B">Couplage fort</text>

  <rect x="80" y="60" width="90" height="44" rx="6" fill="none" stroke="#D9822B" stroke-width="2" />
  <text x="125" y="87" text-anchor="middle" font-size="13" fill="currentColor">A</text>
