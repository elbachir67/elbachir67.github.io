<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="inherit">
  <defs><marker id="figN_broker-fn" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="currentColor" /></marker></defs>
  <rect x="0" y="0" width="900" height="470" fill="none" />
  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="currentColor">RabbitMQ : la boite aux lettres durable entre les services</text>

  <rect x="40" y="150" width="190" height="90" rx="10" fill="#ea7d2b" />
  <text x="135" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="white">backend</text>
  <text x="135" y="205" text-anchor="middle" font-size="10" fill="white">publie les faits en JSON</text>
  <text x="135" y="221" text-anchor="middle" font-size="9" fill="white">(Spring AMQP)</text>

  <rect x="330" y="120" width="240" height="150" rx="12" fill="none" stroke="#a8322d" stroke-width="3" />
  <text x="450" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8322d">RabbitMQ</text>
  <rect x="350" y="165" width="200" height="40" rx="6" fill="#a8322d" />
  <text x="450" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="white">exchange topic</text>
  <text x="450" y="198" text-anchor="middle" font-size="9" fill="white">senresto.evenements</text>
  <text x="450" y="230" text-anchor="middle" font-size="9" fill="currentColor">cles de routage : commande.creee,</text>
  <text x="450" y="245" text-anchor="middle" font-size="9" fill="currentColor">commande.confirmee, commande.statut</text>

  <line x1="230" y1="195" x2="326" y2="195" stroke="currentColor" stroke-width="2.5" marker-end="url(#figN_broker-fn)" />

  <rect x="620" y="60" width="240" height="66" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
  <text x="740" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">queue durable notifications.commandes</text>
  <text x="740" y="103" text-anchor="middle" font-size="9" fill="currentColor">liee a commande.* — les SMS</text>
  <rect x="620" y="300" width="240" height="66" rx="8" fill="none" stroke="#7a3a9c" stroke-width="2" />
  <text x="740" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a3a9c">queue durable paiement.confirmations</text>
  <text x="740" y="343" text-anchor="middle" font-size="9" fill="currentColor">liee a commande.confirmee</text>

  <line x1="570" y1="160" x2="660" y2="126" stroke="currentColor" stroke-width="2" marker-end="url(#figN_broker-fn)" />
  <line x1="570" y1="230" x2="660" y2="300" stroke="currentColor" stroke-width="2" marker-end="url(#figN_broker-fn)" />

  <rect x="640" y="150" width="200" height="56" rx="8" fill="currentColor" />
  <text x="740" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="white">notifications</text>
  <text x="740" y="190" text-anchor="middle" font-size="9" fill="white">@RabbitListener (dans la JVM)</text>
  <line x1="740" y1="126" x2="740" y2="146" stroke="currentColor" stroke-width="2" marker-end="url(#figN_broker-fn)" />

  <rect x="640" y="390" width="200" height="56" rx="8" fill="#7a3a9c" />
  <text x="740" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="white">paiement-service</text>
  <text x="740" y="430" text-anchor="middle" font-size="9" fill="white">Python + pika (conteneur a part)</text>
  <line x1="740" y1="366" x2="740" y2="386" stroke="currentColor" stroke-width="2" marker-end="url(#figN_broker-fn)" />

  <text x="400" y="330" text-anchor="middle" font-size="11" fill="currentColor">Le producteur ignore qui consomme ; les queues DURABLES gardent</text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="currentColor">les messages tant que le consommateur n'a pas dit "ack".</text>
  <text x="400" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6b46">Un consommateur eteint = des messages qui ATTENDENT — pas une panne.</text>
</svg>
