<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="inherit">
  <defs>
    <marker id="figC_inversion-fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#cc1f1f" />
    </marker>
    <marker id="figC_inversion-fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3aa84d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="none" />

  
  <text x="200" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#cc1f1f">Aujourd'hui (couches)</text>

  <rect x="110" y="55" width="180" height="46" rx="6" fill="#ea7d2b" />
  <text x="200" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CommandeService</text>
  <line x1="200" y1="101" x2="200" y2="128" stroke="#cc1f1f" stroke-width="2.5" marker-end="url(#figC_inversion-fr)" />

  <rect x="110" y="132" width="180" height="46" rx="6" fill="#7a3a9c" />
  <text x="200" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CommandeRepository</text>
  <line x1="200" y1="178" x2="200" y2="205" stroke="#cc1f1f" stroke-width="2.5" marker-end="url(#figC_inversion-fr)" />

  <rect x="110" y="209" width="180" height="46" rx="6" fill="currentColor" />
  <text x="200" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="white">JdbcTemplate</text>
  <line x1="200" y1="255" x2="200" y2="282" stroke="#cc1f1f" stroke-width="2.5" marker-end="url(#figC_inversion-fr)" />

  <rect x="110" y="286" width="180" height="46" rx="6" fill="currentColor" />
  <text x="200" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="white">BDD</text>

  <text x="200" y="366" text-anchor="middle" font-size="12" fill="currentColor">le metier depend de la technique :</text>
  <text x="200" y="384" text-anchor="middle" font-size="12" fill="currentColor">pas de BDD, pas de test</text>

  
  <line x1="400" y1="40" x2="400" y2="360" stroke="currentColor" stroke-width="1" stroke-dasharray="6,5" />

  
  <text x="600" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#3aa84d">Demain (inversion)</text>

  <rect x="510" y="55" width="180" height="46" rx="6" fill="#ea7d2b" />
  <text x="600" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Domaine (metier)</text>

  <rect x="510" y="132" width="180" height="46" rx="6" fill="none" stroke="#ea7d2b" stroke-width="2" stroke-dasharray="7,4" />
  <text x="600" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea7d2b">interface CommandesPort</text>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#ea7d2b">definie PAR le domaine</text>

  <line x1="600" y1="101" x2="600" y2="128" stroke="#3aa84d" stroke-width="2.5" marker-end="url(#figC_inversion-fv)" />

  <rect x="510" y="240" width="180" height="46" rx="6" fill="#7a3a9c" />
  <text x="600" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AdaptateurJdbc</text>
  <text x="600" y="278" text-anchor="middle" font-size="11" fill="white">implements CommandesPort</text>

  <line x1="600" y1="236" x2="600" y2="182" stroke="#3aa84d" stroke-width="2.5" marker-end="url(#figC_inversion-fv)" />
  <text x="710" y="212" text-anchor="middle" font-size="11" fill="#3aa84d">la fleche</text>
  <text x="710" y="228" text-anchor="middle" font-size="11" fill="#3aa84d">remonte !</text>

  <text x="600" y="366" text-anchor="middle" font-size="12" fill="currentColor">la technique depend du metier :</text>
  <text x="600" y="384" text-anchor="middle" font-size="12" fill="currentColor">le domaine ne connait plus la BDD</text>
</svg>
