<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="inherit">
  <defs>
    <marker id="fig1_god_controller-fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="460" fill="none" />

  
  <rect x="40" y="170" width="130" height="80" rx="8" fill="#3aa84d" stroke="currentColor" stroke-width="2" />
  <text x="105" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Frontend</text>
  <text x="105" y="226" text-anchor="middle" font-size="13" fill="white">React</text>

  
  <line x1="170" y1="210" x2="225" y2="210" stroke="currentColor" stroke-width="2" marker-end="url(#fig1_god_controller-fleche)" />
  <text x="198" y="198" text-anchor="middle" font-size="11" fill="currentColor">HTTP</text>

  
  <rect x="235" y="40" width="340" height="360" rx="10" fill="none" stroke="#cc1f1f" stroke-width="3" />
  <text x="405" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#cc1f1f">SenRestoController</text>
  <text x="405" y="86" text-anchor="middle" font-size="12" fill="#cc1f1f">414 lignes, une seule classe</text>

  <rect x="255" y="100" width="300" height="48" rx="6" fill="#3a52a8" />
  <text x="405" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Routes HTTP</text>
  <text x="405" y="137" text-anchor="middle" font-size="11" fill="white">9 endpoints @GetMapping / @PostMapping...</text>

  <rect x="255" y="156" width="300" height="48" rx="6" fill="#ea7d2b" />
  <text x="405" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Validation</text>
  <text x="405" y="193" text-anchor="middle" font-size="11" fill="white">dupliquee, quartiers en 3 exemplaires</text>

  <rect x="255" y="212" width="300" height="48" rx="6" fill="#ea7d2b" />
  <text x="405" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Regles metier</text>
  <text x="405" y="249" text-anchor="middle" font-size="11" fill="white">machine a etats if/else, Haversine, frais</text>

  <rect x="255" y="268" width="300" height="48" rx="6" fill="#7a3a9c" />
  <text x="405" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="white">SQL</text>
  <text x="405" y="305" text-anchor="middle" font-size="11" fill="white">11 requetes eparpillees (dont N+1)</text>

  <rect x="255" y="324" width="300" height="48" rx="6" fill="currentColor" />
  <text x="405" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Notifications</text>
  <text x="405" y="361" text-anchor="middle" font-size="11" fill="white">"SMS" en System.out.println</text>

  
  <line x1="575" y1="210" x2="630" y2="210" stroke="currentColor" stroke-width="2" marker-end="url(#fig1_god_controller-fleche)" />
  <text x="602" y="198" text-anchor="middle" font-size="11" fill="currentColor">JDBC</text>

  
  <rect x="640" y="170" width="110" height="80" rx="8" fill="#7a3a9c" stroke="currentColor" stroke-width="2" />
  <text x="695" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="white">BDD</text>
  <text x="695" y="226" text-anchor="middle" font-size="12" fill="white">H2 / PostgreSQL</text>

  
  <text x="390" y="440" text-anchor="middle" font-size="13" fill="currentColor">Une seule classe fait tout : chaque modification traverse tout, rien ne se teste isolement.</text>
</svg>
