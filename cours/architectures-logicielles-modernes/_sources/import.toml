# Comment chaque séance de ce cours a été importée (US-41).
#
# scripts/verifier_conversion.py rejoue ces imports en CI et échoue si le .qmd ou les figures commités
# diffèrent de ce que le script produit : une conversion oubliée ne peut donc pas passer inaperçue.
# La commande /importer-chapitre (US-20) écrira ce fichier.
#
# Les chemins sont relatifs au dossier du cours.

[[chapitres]]
tex = "_sources/cm1_archi_seance1.tex"
sortie = "chapitres/01-du-chaos-aux-couches.qmd"
figures = "figures"
alt = "_sources/textes-alternatifs.toml"
description = "Séance 1 du cours Architectures Logicielles Modernes : dette architecturale, attributs de qualité, couplage, cohésion et refactoring vers une architecture en couches."

[chapitres.figures_python]
figA_cout_changement = "_sources/figs/figA.py"

[[chapitres]]
tex = "_sources/cm2_archi_seance2.tex"
sortie = "chapitres/02-l-hexagone.qmd"
figures = "figures"
alt = "_sources/textes-alternatifs.toml"
description = "Architectures Logicielles — Séance 2 — L'hexagone : mettre le domaine au centre, la technique en périphérie"
