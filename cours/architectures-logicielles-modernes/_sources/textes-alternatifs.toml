# Textes alternatifs des figures qui n'ont pas de légende dans le .tex, validés par le PO.
#
# Un brouillon (US-58) ne suffit pas : rien n'arrive ici sans que le PO l'ait accepté,
# corrigé ou réécrit. Le manifeste dit, figure par figure, laquelle de ces trois.

fig2_couches = "Les trois couches — Présentation, Service, Repository — avec des dépendances à sens unique vers la base de données."
figB_couplage = "Comparaison entre couplage fort, où les quatre composants dépendent tous les uns des autres, et couplage faible, où chacun ne connaît que ses voisins déclarés."
figC_inversion = "Comparaison de deux schémas de dépendances. À gauche, en couches : le service métier dépend du repository, qui dépend de JdbcTemplate, puis de la base de données — sans base, aucun test possible. À droite, avec inversion : le domaine définit l'interface CommandesPort, qu'un adaptateur JDBC implémente ; la flèche de dépendance remonte vers le domaine, qui ne connaît plus la base."
figD_hexagone = "L'application représentée en hexagone. Au centre, le domaine porte les règles métier, la validation, la machine à états et les calculs, sans Spring, sans SQL ni HTTP. Un port entrant expose l'API métier, deux ports sortants couvrent la persistance et la notification. Autour de l'hexagone, les adaptateurs REST, JDBC, InMemory et SMS se branchent sur ces ports."
figE_swap = "Le même domaine dans deux contextes. En production, il passe par l'interface CommandesPort vers un adaptateur JDBC et une base PostgreSQL ou H2. Dans les tests unitaires, la même interface mène à un adaptateur en mémoire, une simple Map : sans Spring ni base de données, le verdict tombe en deux secondes."

# Séances 3, 4 et 5 (US-69) : brouillons rédigés par la chaîne à partir du texte des SVG
# (US-58), puis validés par le PO tels quels, le 26 septembre 2026.
figG_modules = "Cinq modules du monolithe. En haut, commandes/ et livraison/ sont détaillés : chacun porte une API publique et un dossier interne/ en pointillés. Une flèche verte, « autorisé : via l'API publique », relie les deux API ; une flèche rouge barrée d'une croix, « INTERDIT : accéder à interne/ = build cassé », relie les deux interne/. En bas, catalogue/, paiement/ et notifications/, résumés."
figH_appel_vs_evenement = "Deux moitiés séparées par un trait vertical. À gauche, l'appel direct synchrone : commandes et livraison échangent deux flèches, « appelle » et « répond » — couplage assumé. À droite, l'événement interne : commandes publie et continue vers CommandeConfirmee, d'où partent deux flèches vers paiement et notifications, tous deux @EventListener — découplage."
figJ_strangler = "Trois étapes côte à côte. Avant : un monolithe modulaire à cinq modules, aux frontières gardées par verify(). Cohabitation, l'étape de ce lab : livraison devient une façade en pointillés, de même API, qui délègue en HTTP à un livraison-service FastAPI extérieur. Plus tard, si justifié : la façade a disparu, et livraison-service est autonome."
figL_reseau = "Deux moitiés séparées par un trait vertical. À gauche, dans la même JVM : une flèche unique de commandes vers livraison, un appel de méthode d'environ cent nanosecondes. À droite, à travers le réseau : entre backend et livraison-service, une flèche rouge de requête et une réponse en pointillés, mille fois plus lente et à trois issues — réponse correcte, erreur, ou pas de réponse."
figK_compose = "Le réseau docker compose, encadré en pointillés. Le navigateur entre dans le frontend React, d'où deux flèches descendent : « /api (commandes) » vers le backend Spring Boot, port 8080, et « positions (carte) » vers livraison-service, FastAPI, port 8001. Le backend descend vers postgres:5432, et une flèche rouge le relie en HTTP à livraison-service."
figN_broker = "Le backend, qui publie les faits en JSON, mène à RabbitMQ et à son exchange topic senresto.evenements. Deux flèches en partent vers deux queues durables : notifications.commandes, liée à commande.*, qui mène au module notifications ; et paiement.confirmations, liée à commande.confirmee, qui mène à paiement-service, en Python."
figO_miroir = "Deux moitiés séparées par un trait vertical, puis un encadré commun. À gauche, l'appel synchrone en panne : backend pointe en rouge vers livraison-service éteint — timeout de deux secondes, puis 503. À droite, l'événement asynchrone : backend publie vers RabbitMQ, qui garde trois messages en attente devant paiement-svc éteint. En bas, « La règle de décision du semestre »."
