<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="DejaVu Sans">
  <defs>
    <marker id="fleche3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a3a5c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#f8f9fb"/>

  <!-- Ligne de temps -->
  <line x1="60" y1="200" x2="750" y2="200" stroke="#1a3a5c" stroke-width="3" marker-end="url(#fleche3)"/>

  <!-- Jalon 1 -->
  <circle cx="110" cy="200" r="9" fill="#ffd966" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="45" y="225" width="130" height="30" rx="6" fill="#ffd966" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="110" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">lab1-depart</text>
  <rect x="45" y="70" width="130" height="100" rx="8" fill="#ffffff" stroke="#cc1f1f" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc1f1f">God controller</text>
  <text x="110" y="118" text-anchor="middle" font-size="11" fill="#1a3a5c">tout dans une</text>
  <text x="110" y="134" text-anchor="middle" font-size="11" fill="#1a3a5c">seule classe</text>
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#1a3a5c">de 414 lignes</text>
  <line x1="110" y1="170" x2="110" y2="188" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Jalon 2 -->
  <circle cx="310" cy="200" r="9" fill="#ffd966" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="245" y="225" width="130" height="30" rx="6" fill="#ffd966" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="310" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">lab1-etape1</text>
  <rect x="245" y="70" width="130" height="100" rx="8" fill="#ffffff" stroke="#ea7d2b" stroke-width="2"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea7d2b">Services extraits</text>
  <text x="310" y="118" text-anchor="middle" font-size="11" fill="#1a3a5c">la logique metier</text>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#1a3a5c">quitte le controller</text>
  <text x="310" y="150" text-anchor="middle" font-size="11" fill="#1a3a5c">(3 services)</text>
  <line x1="310" y1="170" x2="310" y2="188" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Jalon 3 -->
  <circle cx="510" cy="200" r="9" fill="#ffd966" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="445" y="225" width="130" height="30" rx="6" fill="#ffd966" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="510" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">lab1-etape2</text>
  <rect x="445" y="70" width="130" height="100" rx="8" fill="#ffffff" stroke="#7a3a9c" stroke-width="2"/>
  <text x="510" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3a9c">Repositories</text>
  <text x="510" y="118" text-anchor="middle" font-size="11" fill="#1a3a5c">le SQL quitte les</text>
  <text x="510" y="134" text-anchor="middle" font-size="11" fill="#1a3a5c">services, quartiers</text>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#1a3a5c">centralises</text>
  <line x1="510" y1="170" x2="510" y2="188" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Jalon 4 -->
  <circle cx="700" cy="200" r="9" fill="#ffd966" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="635" y="225" width="130" height="30" rx="6" fill="#ffd966" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="700" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">lab1-final</text>
  <rect x="635" y="70" width="130" height="100" rx="8" fill="#ffffff" stroke="#3aa84d" stroke-width="2"/>
  <text x="700" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#3aa84d">DTOs + finitions</text>
  <text x="700" y="118" text-anchor="middle" font-size="11" fill="#1a3a5c">contrats d'API</text>
  <text x="700" y="134" text-anchor="middle" font-size="11" fill="#1a3a5c">explicites,</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#1a3a5c">4 tests verts</text>
  <line x1="700" y1="170" x2="700" y2="188" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Legende -->
  <text x="400" y="295" text-anchor="middle" font-size="13" fill="#1a3a5c">Bloques ? git checkout du tag suivant et on repart : personne ne reste au bord de la route.</text>
</svg>
