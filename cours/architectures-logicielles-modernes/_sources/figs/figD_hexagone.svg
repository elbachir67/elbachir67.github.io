<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="DejaVu Sans">
  <defs>
    <marker id="fd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a3a5c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="480" fill="#ffffff"/>

  <!-- Zone application (frontiere de l'hexagone) -->
  <rect x="250" y="60" width="360" height="330" rx="14" fill="#f8f9fb" stroke="#1a3a5c" stroke-width="2.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">L'application (l'hexagone)</text>

  <!-- Domaine au centre -->
  <rect x="320" y="150" width="220" height="130" rx="10" fill="#ea7d2b"/>
  <text x="430" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="white">DOMAINE</text>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="white">regles metier, validation,</text>
  <text x="430" y="227" text-anchor="middle" font-size="11" fill="white">machine a etats, calculs</text>
  <text x="430" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="white">zero Spring, zero SQL, zero HTTP</text>

  <!-- Port entrant (gauche, sur la frontiere) -->
  <rect x="216" y="180" width="68" height="70" rx="8" fill="#ffffff" stroke="#3a52a8" stroke-width="2.5"/>
  <text x="250" y="207" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a52a8">PORT</text>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#3a52a8">entrant</text>
  <text x="250" y="238" text-anchor="middle" font-size="9" fill="#3a52a8">(API metier)</text>

  <!-- Ports sortants (droite, sur la frontiere) -->
  <rect x="576" y="120" width="68" height="64" rx="8" fill="#ffffff" stroke="#7a3a9c" stroke-width="2.5"/>
  <text x="610" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a3a9c">PORT</text>
  <text x="610" y="160" text-anchor="middle" font-size="10" fill="#7a3a9c">sortant</text>
  <text x="610" y="175" text-anchor="middle" font-size="9" fill="#7a3a9c">persistance</text>

  <rect x="576" y="266" width="68" height="64" rx="8" fill="#ffffff" stroke="#3aa84d" stroke-width="2.5"/>
  <text x="610" y="291" text-anchor="middle" font-size="10" font-weight="bold" fill="#3aa84d">PORT</text>
  <text x="610" y="306" text-anchor="middle" font-size="10" fill="#3aa84d">sortant</text>
  <text x="610" y="321" text-anchor="middle" font-size="9" fill="#3aa84d">notification</text>

  <!-- Adaptateur primaire (gauche) -->
  <rect x="40" y="180" width="130" height="70" rx="8" fill="#3a52a8"/>
  <text x="105" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Adaptateur</text>
  <text x="105" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="white">REST</text>
  <text x="105" y="241" text-anchor="middle" font-size="9" fill="white">controllers Spring</text>

  <!-- Adaptateurs secondaires (droite) -->
  <rect x="700" y="88" width="130" height="60" rx="8" fill="#7a3a9c"/>
  <text x="765" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Adaptateur JDBC</text>
  <text x="765" y="130" text-anchor="middle" font-size="9" fill="white">H2 / PostgreSQL</text>

  <rect x="700" y="160" width="130" height="60" rx="8" fill="#7a3a9c"/>
  <text x="765" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Adaptateur</text>
  <text x="765" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="white">InMemory</text>

  <rect x="700" y="268" width="130" height="60" rx="8" fill="#3aa84d"/>
  <text x="765" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Adaptateur SMS</text>
  <text x="765" y="310" text-anchor="middle" font-size="9" fill="white">console (System.out)</text>

  <!-- Fleches : toutes pointent VERS l'interieur -->
  <line x1="170" y1="215" x2="212" y2="215" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>
  <line x1="284" y1="215" x2="316" y2="215" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>

  <line x1="700" y1="118" x2="672" y2="118" stroke="#1a3a5c" stroke-width="2.5"/>
  <line x1="672" y1="118" x2="672" y2="140" stroke="#1a3a5c" stroke-width="2.5"/>
  <line x1="672" y1="140" x2="648" y2="140" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>

  <line x1="700" y1="190" x2="672" y2="190" stroke="#1a3a5c" stroke-width="2.5"/>
  <line x1="672" y1="190" x2="672" y2="168" stroke="#1a3a5c" stroke-width="2.5"/>
  <line x1="672" y1="168" x2="648" y2="168" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>

  <line x1="700" y1="298" x2="648" y2="298" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>

  <line x1="540" y1="152" x2="572" y2="152" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>
  <line x1="540" y1="298" x2="572" y2="298" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fd)"/>

  <!-- Legende -->
  <text x="430" y="430" text-anchor="middle" font-size="13" fill="#1a3a5c">Les ports sont des interfaces definies PAR le domaine ; les adaptateurs les implementent ou les appellent.</text>
  <text x="430" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">Toutes les fleches de dependance pointent vers le centre : le domaine ne depend de rien.</text>
</svg>
