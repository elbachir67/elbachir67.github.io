<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="DejaVu Sans">
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a3a5c"/>
    </marker>
    <marker id="flr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#cc1f1f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>

  <!-- Gauche : in-JVM -->
  <text x="215" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#3aa84d">Hier : dans la meme JVM</text>
  <rect x="60" y="70" width="140" height="56" rx="8" fill="#ea7d2b"/>
  <text x="130" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white">commandes</text>
  <text x="130" y="113" text-anchor="middle" font-size="9" fill="white">confirmer()</text>
  <rect x="240" y="70" width="140" height="56" rx="8" fill="#3a52a8"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white">livraison</text>
  <text x="310" y="113" text-anchor="middle" font-size="9" fill="white">assigner(quartier)</text>
  <line x1="200" y1="98" x2="236" y2="98" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="215" y="160" text-anchor="middle" font-size="11" fill="#1C2A33">un appel de methode :</text>
  <text x="215" y="178" text-anchor="middle" font-size="11" fill="#1C2A33">~100 nanosecondes, ne rate jamais,</text>
  <text x="215" y="196" text-anchor="middle" font-size="11" fill="#1C2A33">reussit ou leve une exception claire</text>

  <line x1="430" y1="46" x2="430" y2="330" stroke="#5A6B75" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- Droite : reseau -->
  <text x="645" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#cc1f1f">Aujourd'hui : a travers le reseau</text>
  <rect x="480" y="70" width="140" height="56" rx="8" fill="#ea7d2b"/>
  <text x="550" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white">backend</text>
  <text x="550" y="113" text-anchor="middle" font-size="9" fill="white">confirmer()</text>
  <rect x="680" y="70" width="150" height="56" rx="8" fill="#2a6b46"/>
  <text x="755" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white">livraison-service</text>
  <text x="755" y="113" text-anchor="middle" font-size="9" fill="white">POST /assignations</text>
  <line x1="620" y1="90" x2="676" y2="90" stroke="#cc1f1f" stroke-width="2.5" marker-end="url(#flr)"/>
  <line x1="676" y1="108" x2="620" y2="108" stroke="#cc1f1f" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#flr)"/>
  <text x="648" y="80" text-anchor="middle" font-size="9" fill="#cc1f1f">requete</text>
  <text x="648" y="140" text-anchor="middle" font-size="9" fill="#cc1f1f">reponse... peut-etre</text>

  <text x="645" y="164" text-anchor="middle" font-size="11" fill="#1C2A33">un appel HTTP : ~des millisecondes (10 000x plus),</text>
  <text x="645" y="182" text-anchor="middle" font-size="11" fill="#1C2A33">et TROIS issues possibles :</text>
  <text x="645" y="206" text-anchor="middle" font-size="11" fill="#3aa84d">1. reponse OK</text>
  <text x="645" y="226" text-anchor="middle" font-size="11" fill="#ea7d2b">2. reponse d'erreur (409, 500...)</text>
  <text x="645" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc1f1f">3. PAS de reponse du tout (timeout, panne)</text>
  <text x="645" y="272" text-anchor="middle" font-size="10" fill="#5A6B75">— et dans le cas 3, l'assignation a-t-elle eu lieu ?</text>
  <text x="645" y="288" text-anchor="middle" font-size="10" fill="#5A6B75">Impossible de le savoir. Bienvenue dans le distribue.</text>

  <text x="430" y="356" text-anchor="middle" font-size="13" fill="#1a3a5c">Le reseau n'est ni fiable, ni instantane, ni gratuit : chaque fleche rouge est une decision d'architecture.</text>
</svg>
