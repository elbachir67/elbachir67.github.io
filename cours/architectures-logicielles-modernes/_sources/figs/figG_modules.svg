<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="DejaVu Sans">
  <defs>
    <marker id="fg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3aa84d"/>
    </marker>
    <marker id="fgr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#cc1f1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a5c">Un module = une API publique (racine) + des internes caches</text>

  <!-- Module commandes -->
  <rect x="60" y="70" width="220" height="180" rx="10" fill="#f8f9fb" stroke="#ea7d2b" stroke-width="2.5"/>
  <text x="170" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea7d2b">commandes/</text>
  <rect x="80" y="108" width="180" height="52" rx="6" fill="#ea7d2b"/>
  <text x="170" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="white">API publique</text>
  <text x="170" y="146" text-anchor="middle" font-size="10" fill="white">CommandeMetier, evenements</text>
  <rect x="80" y="172" width="180" height="60" rx="6" fill="#ffffff" stroke="#ea7d2b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="170" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea7d2b">interne/</text>
  <text x="170" y="212" text-anchor="middle" font-size="10" fill="#5A6B75">adaptateur JDBC, validation,</text>
  <text x="170" y="226" text-anchor="middle" font-size="10" fill="#5A6B75">machine a etats</text>

  <!-- Module livraison -->
  <rect x="580" y="70" width="220" height="180" rx="10" fill="#f8f9fb" stroke="#3a52a8" stroke-width="2.5"/>
  <text x="690" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a52a8">livraison/</text>
  <rect x="600" y="108" width="180" height="52" rx="6" fill="#3a52a8"/>
  <text x="690" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="white">API publique</text>
  <text x="690" y="146" text-anchor="middle" font-size="10" fill="white">AssignationLivreurs</text>
  <rect x="600" y="172" width="180" height="60" rx="6" fill="#ffffff" stroke="#3a52a8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="690" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a52a8">interne/</text>
  <text x="690" y="212" text-anchor="middle" font-size="10" fill="#5A6B75">adaptateur JDBC livreurs,</text>
  <text x="690" y="226" text-anchor="middle" font-size="10" fill="#5A6B75">CalculateurEta</text>

  <!-- Fleche autorisee : commandes -> API livraison -->
  <line x1="280" y1="134" x2="596" y2="134" stroke="#3aa84d" stroke-width="2.5" marker-end="url(#fg)"/>
  <text x="438" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#3aa84d">autorise : via l'API publique</text>

  <!-- Fleche interdite : commandes -> interne livraison -->
  <line x1="280" y1="210" x2="450" y2="210" stroke="#cc1f1f" stroke-width="2.5" stroke-dasharray="8,5"/>
  <line x1="450" y1="210" x2="596" y2="205" stroke="#cc1f1f" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#fgr)"/>
  <text x="438" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc1f1f">INTERDIT : acceder a interne/ = build casse</text>
  <line x1="425" y1="196" x2="451" y2="222" stroke="#cc1f1f" stroke-width="3"/>
  <line x1="451" y1="196" x2="425" y2="222" stroke="#cc1f1f" stroke-width="3"/>

  <!-- Rangee du bas : catalogue, paiement, notifications -->
  <rect x="60" y="310" width="220" height="120" rx="10" fill="#f8f9fb" stroke="#3aa84d" stroke-width="2.5"/>
  <text x="170" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#3aa84d">catalogue/</text>
  <text x="170" y="360" text-anchor="middle" font-size="10" fill="#1C2A33">restaurants et plats</text>
  <text x="170" y="378" text-anchor="middle" font-size="10" fill="#5A6B75">API : CatalogueMetier</text>
  <text x="170" y="396" text-anchor="middle" font-size="10" fill="#5A6B75">interne/ : adaptateur JDBC</text>

  <rect x="320" y="310" width="220" height="120" rx="10" fill="#f8f9fb" stroke="#7a3a9c" stroke-width="2.5"/>
  <text x="430" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3a9c">paiement/</text>
  <text x="430" y="360" text-anchor="middle" font-size="10" fill="#1C2A33">mobile money simule</text>
  <text x="430" y="378" text-anchor="middle" font-size="10" fill="#5A6B75">reagit aux evenements</text>
  <text x="430" y="396" text-anchor="middle" font-size="10" fill="#5A6B75">de commandes/</text>

  <rect x="580" y="310" width="220" height="120" rx="10" fill="#f8f9fb" stroke="#5a5a5a" stroke-width="2.5"/>
  <text x="690" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">notifications/</text>
  <text x="690" y="360" text-anchor="middle" font-size="10" fill="#1C2A33">les SMS aux clients</text>
  <text x="690" y="378" text-anchor="middle" font-size="10" fill="#5A6B75">reagit aux evenements</text>
  <text x="690" y="396" text-anchor="middle" font-size="10" fill="#5A6B75">de commandes/</text>

  <text x="430" y="478" text-anchor="middle" font-size="13" fill="#1a3a5c">Cinq contextes, cinq modules, cinq membres de groupe. Un paquetage racine par module = son API publique ;</text>
  <text x="430" y="500" text-anchor="middle" font-size="13" fill="#1a3a5c">tout ce qui est dans interne/ est invisible des autres modules — et Spring Modulith le verifie par un test.</text>
</svg>
