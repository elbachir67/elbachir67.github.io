<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="DejaVu Sans">
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <!-- Panneau gauche : couplage fort -->
  <text x="200" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9822B">Couplage fort</text>

  <rect x="80" y="60" width="90" height="44" rx="6" fill="#ffffff" stroke="#D9822B" stroke-width="2"/>
  <text x="125" y="87" text-anchor="middle" font-size="13" fill="#1C2A33">A</text>
  <rect x="230" y="60" width="90" height="44" rx="6" fill="#ffffff" stroke="#D9822B" stroke-width="2"/>
  <text x="275" y="87" text-anchor="middle" font-size="13" fill="#1C2A33">B</text>
  <rect x="80" y="190" width="90" height="44" rx="6" fill="#ffffff" stroke="#D9822B" stroke-width="2"/>
  <text x="125" y="217" text-anchor="middle" font-size="13" fill="#1C2A33">C</text>
  <rect x="230" y="190" width="90" height="44" rx="6" fill="#ffffff" stroke="#D9822B" stroke-width="2"/>
  <text x="275" y="217" text-anchor="middle" font-size="13" fill="#1C2A33">D</text>

  <!-- toutes les liaisons croisees (orthogonales) -->
  <line x1="170" y1="82" x2="230" y2="82" stroke="#D9822B" stroke-width="2"/>
  <line x1="170" y1="212" x2="230" y2="212" stroke="#D9822B" stroke-width="2"/>
  <line x1="125" y1="104" x2="125" y2="190" stroke="#D9822B" stroke-width="2"/>
  <line x1="275" y1="104" x2="275" y2="190" stroke="#D9822B" stroke-width="2"/>
  <line x1="170" y1="95" x2="200" y2="95" stroke="#D9822B" stroke-width="2"/>
  <line x1="200" y1="95" x2="200" y2="200" stroke="#D9822B" stroke-width="2"/>
  <line x1="200" y1="200" x2="230" y2="200" stroke="#D9822B" stroke-width="2"/>
  <line x1="170" y1="225" x2="200" y2="225" stroke="#D9822B" stroke-width="2"/>
  <line x1="200" y1="225" x2="200" y2="240" stroke="#D9822B" stroke-width="2"/>
  <line x1="200" y1="240" x2="240" y2="240" stroke="#D9822B" stroke-width="2"/>
  <line x1="240" y1="240" x2="240" y2="234" stroke="#D9822B" stroke-width="2"/>

  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#1C2A33">tout depend de tout :</text>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="#1C2A33">toucher A, c'est risquer B, C et D</text>

  <!-- Separateur -->
  <line x1="400" y1="40" x2="400" y2="300" stroke="#5A6B75" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- Panneau droit : couplage faible -->
  <text x="600" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E8B57">Couplage faible</text>

  <rect x="480" y="60" width="90" height="44" rx="6" fill="#ffffff" stroke="#2E8B57" stroke-width="2"/>
  <text x="525" y="87" text-anchor="middle" font-size="13" fill="#1C2A33">A</text>
  <rect x="630" y="60" width="90" height="44" rx="6" fill="#ffffff" stroke="#2E8B57" stroke-width="2"/>
  <text x="675" y="87" text-anchor="middle" font-size="13" fill="#1C2A33">B</text>
  <rect x="480" y="190" width="90" height="44" rx="6" fill="#ffffff" stroke="#2E8B57" stroke-width="2"/>
  <text x="525" y="217" text-anchor="middle" font-size="13" fill="#1C2A33">C</text>
  <rect x="630" y="190" width="90" height="44" rx="6" fill="#ffffff" stroke="#2E8B57" stroke-width="2"/>
  <text x="675" y="217" text-anchor="middle" font-size="13" fill="#1C2A33">D</text>

  <!-- liaisons minimales -->
  <line x1="570" y1="82" x2="630" y2="82" stroke="#2E8B57" stroke-width="2"/>
  <line x1="525" y1="104" x2="525" y2="190" stroke="#2E8B57" stroke-width="2"/>

  <text x="600" y="285" text-anchor="middle" font-size="12" fill="#1C2A33">des interfaces minimales :</text>
  <text x="600" y="304" text-anchor="middle" font-size="12" fill="#1C2A33">toucher A ne concerne que ses voisins declares</text>
</svg>
