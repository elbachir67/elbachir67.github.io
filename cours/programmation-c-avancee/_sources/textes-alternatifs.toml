# Textes alternatifs des figures qui n'ont pas de légende dans le .tex, validés par le PO.
#
# Un brouillon (US-58) ne suffit pas : rien n'arrive ici sans que le PO l'ait accepté,
# corrigé ou réécrit. Le manifeste dit, figure par figure, laquelle de ces trois.

00-introduction-01 = "Frise de l'histoire du C : BCPL puis B mènent au C, qui sert à réécrire UNIX."
00-introduction-02 = "Filiation du C depuis le K&R : les normes successives, de C89 à C23."
00-introduction-03 = "Les six parties du cours, des fondamentaux du langage jusqu'à l'exécution des programmes."
00-introduction-04 = "L'environnement de travail : Windows, Linux et macOS convergent vers un même conteneur Docker, qui unifie les outils de tous les étudiants."
00-introduction-05 = "L'organisation pédagogique : cours magistral, travaux dirigés et travaux pratiques."
01-fondamentaux-01 = "Tableau de 6 lignes et 3 colonnes, en-tête Type, Taille (x86-64) et Min/Max, première colonne Type, char, short, int, long et long long."
01-fondamentaux-02 = "double (64 bits) est relié à S ; s'y ajoutent, de haut en bas : float (32 bits) ; puis Exposant (8 bits) et Mantisse (23 bits) ; puis S, Exposant (11 bits) et Mantisse (52 bits) ; une suite de 5 cases s'y répète."
01-fondamentaux-03 = "char et short mènent à int, qui mène à long ; les flèches portent « promotion » et « conversion »."
01-fondamentaux-04 = "Tableau de 15 lignes et 5 colonnes, en-tête Priorité, Opérateurs et Associativité, première colonne Priorité, Haute et Basse."
01-fondamentaux-05 = "prog.c Source C mène à Préprocesseur (cpp), puis prog.i Source étendu, Compilateur (cc1), prog.s Assembleur, Assembleur (as), prog.o Objet relocatable, Lieur (ld) et prog Exécutable."
02-representation-numerique-01 = "Une flèche mène à 8+0+2+1=11_10 ; s'y ajoutent, de haut en bas : 1011_2 = ?_10 ; puis MSB et LSB ; une suite de 4 cases s'y répète."
02-representation-numerique-02 = "Une flèche mène à 1101_2 ; s'y ajoutent, de haut en bas : 13_10 → binaire, 13 ÷ 2 = 6 reste 1 (LSB), 6 ÷ 2 = 3 reste 0, 3 ÷ 2 = 1 reste 1 et 1 ÷ 2 = 0 reste 1 (MSB)."
02-representation-numerique-03 = "Tableau de 3 lignes et 17 colonnes, en-tête Hex, 0, 1, 2, 3, 4, jusqu'à F, première colonne Hex, Dec et Bin."
02-representation-numerique-04 = "1011 mène à B (11) ; 1010 mène à A (10) ; s'y ajoutent, de haut en bas : 10111010_2 → hex et = 0xBA."
02-representation-numerique-05 = "De haut en bas : unsigned char : 11011011_2 et = 128+64+16+8+2+1 = 219 ; une suite de 8 cases s'y répète."
02-representation-numerique-06 = "Tableau de 5 lignes et 4 colonnes, en-tête Type, Bits, Min et Max, première colonne Type, unsigned char, unsigned short, unsigned int et unsigned long ; s'y ajoutent Plages des types unsigned."
02-representation-numerique-07 = "De haut en bas : signed char: -3, signe, = -128+64+32+16+8+4+1 = -3, signed char: +120 et = 0+64+32+16+8+0+0+0 = 120 ; une suite de 16 cases s'y répète."
02-representation-numerique-08 = "De haut en bas : Négation : 5 → -5 (8 bits) ; puis x = 5 et 0x05 ; puis x et 0xFA ; puis x + 1 et 0xFB = -5 ; une suite de 24 cases s'y répète."
02-representation-numerique-09 = "De haut en bas : Même motif binaire, deux interprétations ; puis 0xFD ; puis unsigned: 253 et signed: -3 ; une suite de 8 cases s'y répète."
02-representation-numerique-10 = "Tableau de 5 lignes et 4 colonnes, en-tête Expression, Type, Évaluation et Résultat, première colonne Expression, -1 < 0U, -1 > -2, 2147483647 > -2147483648 et 2147483647U > -2147483648 ; s'y ajoutent Pièges de comparaison (32 bits)."
02-representation-numerique-11 = "De haut en bas : Extension unsigned : 8 → 16 bits ; puis uint8: 250 et 0xFA ; puis uint16: 250 et 0x00FA ; une suite de 24 cases s'y répète."
02-representation-numerique-12 = "De haut en bas : Extension signed : 8 → 16 bits ; puis int8: -6 et 0xFA ; puis int16: -6 et 0xFFFA ; puis bit de signe répliqué ; une suite de 24 cases s'y répète."
02-representation-numerique-13 = "carry mène à perdu ; s'y ajoutent, de haut en bas : Wrap-around unsigned 8 bits : le carry perdu ; puis 255 et 0xFF ; puis + 1 ; puis =, 1 et 0x00 = 0 ; une suite de 24 cases s'y répète."
02-representation-numerique-14 = "De haut en bas : Overflow signed 8 bits (UB) : changement de signe ; puis 127 et T_max ; puis + 1 ; puis = et = -128 (UB!) ; une suite de 24 cases s'y répète."
02-representation-numerique-15 = "De haut en bas : s, exposant et fraction (mantisse) ; puis 1 bit, 8 bits et 23 bits."
02-representation-numerique-16 = "De haut en bas : 0, 10000010 et 10100000000000000000000 ; puis s=0, exp=130 et frac."
04-structures-unions-01 = "0x1000 (ptr) mène à x: 10 (0x1000, struct Point p, p.x) ; s'y ajoutent, y: 20 (0x1004, p.y ou ptr->y)."
04-structures-unions-02 = "Disposition en mémoire de struct S1, 12 octets : a, puis 3 octets de padding, b sur 4 octets, c, puis 3 octets de padding."
04-structures-unions-03 = "Le schéma porte struct Bad (24 octets), a, c, struct Good (16 octets), a et c ; une suite de 21 cases s'y répète."
04-structures-unions-04 = "Les 12 octets de struct Data en mémoire : 41 00 00 00, puis 78 56 34 12, puis CD AB 00 00."
04-structures-unions-05 = "Le schéma porte struct Rectangle (20 octets), top_left.x (+0, 4 octets), top_left.y (+4, 4 octets), bottom_right.x (+8, 4 octets), bottom_right.y (+12, 4 octets) et color + padding (+16, 1+3 octets)."
04-structures-unions-06 = "Le tableau points[3] en mémoire : points[0] vaut (0, 0), points[1] (10, 20) et points[2] (30, 40), rangés à la suite."
04-structures-unions-07 = "Le schéma porte union Data (4 octets), 44 (c[0]='D'), 43 (c[1]='C'), 42 (c[2]='B') et 41 (c[3]='A')."
04-structures-unions-08 = "Variant (16 octets), type (4) (enum: 0, 1, ou 2), padding (4) et value (8) (int / float / char*)."
04-structures-unions-09 = "Représentation en bits : 1 1 0 0 1 0 1 1."
04-structures-unions-10 = "p: 0x2000 mène à x: 10 ; s'y ajoutent, Stack, Heap (0x2000) et y: 20."
04-structures-unions-11 = "Une structure Container sur le tas : size vaut 4, name pointe vers la chaîne \"test\", et data vers un tableau de quatre cases, de [0] à [3]."
04-structures-unions-12 = "FlexArray avec n=4, length: 4, [0], [1], [2] et [3]."
fig01_memory_organization = "Figure portant « Organisation mémoire : 1 mot = 8 octets (64 bits) », « +… », « un mot = 8 octets », « Rappel Hexadécimal »."
fig02_address_multioctet = "Figure portant « Adresse d'un objet multi-octets », « 0x100… », « Variable x (4 octets) », « &x = 0x1000 », « L'adresse de x est 0x1000 (adresse du premier octet) », « Little-Endian: 0x12345678 »."
fig03_type_sizes = "Figure intitulée « Taille des types selon l'architecture »."
fig04_endianness = "Stockage de 0x01234567 à l'adresse 0x100. En big-endian (IBM, SPARC, réseau), l'octet de poids fort 01 est à l'adresse la plus basse ; en little-endian (Intel x86/x64, ARM), c'est l'octet de poids faible 67."
fig05_pointer_aspects = "Figure portant « Les deux aspects d'un pointeur », « Adresse », « 0x1000 », « int x = 42 », « (0x2A = 42 en little-endian) », « 0x2000 », « int *p = &x », « (p contient 0x1000) »."
fig06_memory_evolution = "Évolution de la mémoire, étape par étape : x vaut 0x3CD02700, stocké en little-endian ; y = x + 3 ; z est déclaré sans valeur ; z = &y + 3 pointe 12 octets plus loin, en 0x24, où *z = y écrit la valeur de y."
fig07_array_memory = "Figure portant « Tableau int arr[5] en mémoire (32 bits, little-endian) », « arr[…] », « 5 éléments × 4 octets = 20 octets total »."
fig08_array_2d = "Le tableau mat[2][3] vu en deux lignes, puis en mémoire, où la ligne 0 et la ligne 1 se suivent de 0x00 à 0x14. L'adresse d'une case vaut base + (i × nb_colonnes + j) × sizeof(int)."
fig09_pointers_array = "Figure portant « Pointeurs p et q sur le tableau arr », « arr[…] », « p = 0x1000 », « q = 0x100C »."
fig10_array_vs_pointer = "Figure intitulée « Différences entre tableau et pointeur »."
fig11_process_memory = "Figure portant « Organisation mémoire d'un processus », « 0xFF », « 0x00 », « Classes de stockage », « … (…) »."
fig12_return_local_array = "Figure portant « Pendant l'appel », « main() », « creer_tableau_FAUX() », « tab[5] = 1,2,3,4,5 », « ✓ tab existe, pointeur valide », « Après le retour », « Zone libérée ! », « ✗ p pointe vers une zone invalide ! »."
fig13_malloc_vs_calloc = "Figure portant « malloc vs calloc », « malloc(5 × sizeof(int)) », « ?? », « Contenu INDÉTERMINÉ », « calloc(5, sizeof(int)) », « 00 », « Initialisé à ZÉRO », « calloc = allocation + initialisation à zéro »."
fig14_vla_vs_malloc = "Figure intitulée « VLA vs Allocation Dynamique »."
fig15_pointer_arithmetic = "Arithmétique des pointeurs selon le type : un int* avance de 4 octets, un short* de 2, un char* de 1. p + n ajoute n × sizeof(*p) octets à l'adresse."
fig16_string_memory = "Figure portant « Représentation de \"Hello\" en mémoire », « '…' », « 0x… », « str[…] », « strlen(str) = 5 », « sizeof(str) = 6 », « ← Terminateur nul (fin de chaîne) »."
fig17_ascii_table = "Figure intitulée « Table ASCII partielle », libellés : « 'A'=0x41, 'a'=0x61, différence=0x20 | Chiffres '0'-'9' : 0x30-0x39 »."
fig18_array_vs_string_pointer = "char arr[] = \"Hello\" est stocké sur la pile et modifiable. char *ptr = \"Hello\" est sur la pile, mais pointe vers le segment .rodata, en lecture seule."
fig19_memory_reinterpretation = "Figure portant « Réinterprétation de 0x11223344 via char* », « cp[…] », « +… », « (little-endian) »."
fig20_array_overflow_evolution = "Figure intitulée « Évolution mémoire : Tableaux et débordements (64 bits) », libellés : « ⚠ Buffer Overflow! », « ⚠ Écrit AVANT le tableau! »."
fig_01_binary_weights = "Le nombre binaire 101.1101 vaut 5,8125 en décimal : chaque bit, de part et d'autre du point binaire, porte son poids en puissance de 2."
fig_02_ieee754_anatomy = "Figure intitulée « Structure IEEE 754 simple précision : … = … », libellés : « signe (1 bit) », « exposant (8 bits) », « fraction (mantisse) (23 bits) », « Signe », « Exposant (biaisé) », « Fraction (1 implicite) »."
fig_04_patriot_missile = "Figure intitulée « 0.1₁₀ = 0.000110011001100110011...₂ (période infinie !) », « Position du bit (après la virgule) » en abscisse, « Valeur du bit » en ordonnée, séries : « Erreur cumulée », libellés : « Début du motif répétitif \"0011\" », « … s (… m) »."
fig_05_softmax_underflow = "La courbe de exp(x), en échelle logarithmique, compare softmax naïf et softmax stable : exp(710) dépasse la limite des float64, exp(-745) tombe à zéro."
