# Comment chaque séance de ce cours a été importée (US-41).
#
# scripts/verifier_conversion.py rejoue ces imports en CI et échoue si le .qmd ou les
# figures commités diffèrent. Écrit par la commande /importer-chapitre (US-20).
#
# Les chemins sont relatifs au dossier du cours.

[[chapitres]]
tex = "_sources/CM_Ch-1_Introduction.tex"
sortie = "chapitres/00-introduction.qmd"
figures = "figures"
alt = "_sources/textes-alternatifs.toml"
description = "Chapitre d'introduction du cours de Programmation C avancée : pourquoi le C, son histoire, la structure du cours, les prérequis et l'environnement de travail."
langage = "c"
cible = "page"
titre = "Introduction"

[chapitres.encadres]
definitionbox = "note|Définition"
examplebox = "tip|Exemple"
warningbox = "warning|Attention"
techbox = "important|En pratique"
infobox = "note|À savoir"

[[chapitres.ressources]]
type = "pdf"
fichier = "ressources/cm-introduction.pdf"
titre = "Le chapitre en PDF"

[[chapitres.ressources]]
type = "tp"
fichier = "ressources/tp-1-environnement.pdf"
titre = "TP 1 — Mise en place de l'environnement"
