# Comment chaque séance de ce cours a été importée (US-41).
#
# scripts/verifier_conversion.py rejoue ces imports en CI et échoue si le .qmd commité diffère de ce
# que le script produit.
#
# Ce cours n'a pas de CM : ses sources ne contiennent que des labs (US-70, inventaire d'US-68). Le
# lab tient donc lieu de séance — son énoncé est la page —, et le PDF que le PO a compilé est
# attaché en ressource. Aucun lab ne porte de figure : il n'y a pas de textes alternatifs.
#
# Les six encadrés du cours sont les mêmes dans les sept labs. Leur genre de callout est une
# décision du PO ; leur titre vient du .tex, qui le porte toujours entre crochets — le titre écrit
# ici n'est qu'un défaut, jamais employé.

