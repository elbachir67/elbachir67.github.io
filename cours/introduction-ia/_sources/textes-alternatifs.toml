# Textes alternatifs des figures qui n'ont pas de légende dans le .tex, validés par le PO.
#
# Un brouillon (US-58) ne suffit pas : rien n'arrive ici sans que le PO l'ait accepté,
# corrigé ou réécrit. Le manifeste dit, figure par figure, laquelle de ces trois.

03-lia-qui-cherche-01 = "Le réseau routier du fil rouge. Dakar, en vert, marqué Départ, est relié à Rufisque (30) et à Mbour (80) ; Rufisque à Thiès (50) ; Mbour à Thiès (70) et à Diourbel (130) ; Thiès à Louga (120) ; Diourbel à Louga (100) ; Louga à Saint-Louis (70), en rouge, marqué Arrivée."
03-lia-qui-cherche-02 = "L'arbre de recherche qu'engendre cette carte. La racine D, Dakar, en vert, a deux enfants : R, Rufisque, et M, Mbour. À gauche, la branche descend R, puis T, Thiès, L, Louga, et S, Saint-Louis, en rose : c'est le but. À droite, sous M, s'ouvrent T et Di, Diourbel, dont les sous-arbres sont abrégés par des points de suspension : un même état réapparaît à plusieurs endroits de l'arbre."
03-lia-qui-cherche-03 = "Parcours en largeur sur la carte. Chaque ville porte son rang de visite : Dakar 1, Rufisque 2, Mbour 3, Thiès 4, Diourbel 5, Louga 6, Saint-Louis 7. BFS vide un niveau entier avant d'entamer le suivant. Le chemin retenu, en bleu épais, passe par Dakar, Rufisque, Thiès, Louga et Saint-Louis."
03-lia-qui-cherche-04 = "Un arbre de recherche sans étiquettes, sur trois niveaux. La racine et ses deux enfants sont bleus : ce sont les nœuds déjà explorés. Les quatre feuilles sont orange : c'est la frontière. Elle compte à elle seule plus de nœuds que tout ce qui la précède, et c'est elle qui occupe la mémoire de BFS."
03-lia-qui-cherche-05 = "Trois quartiers : Fass, en vert, Médina, en rouge, et Plateau, en bleu. Fass rejoint Médina directement en 30 minutes, ou par Plateau en 10 plus 10 minutes. BFS retient le trajet direct parce qu'il compte une seule étape, alors qu'il dure dix minutes de plus."
03-lia-qui-cherche-06 = "Parcours en profondeur sur la même carte. Dakar 1, Rufisque 2, Thiès 3, Louga 4, Saint-Louis 5 ; le chemin suivi est en rose. Mbour et Diourbel restent gris : DFS ne les a jamais ouverts."
03-lia-qui-cherche-07 = "Un arbre sans étiquettes. En rose, le chemin courant descend de la racine jusqu'au nœud en cours d'exploration, marqué d'un rose plus foncé. En orange, les cinq frères en attente, un par niveau. DFS ne garde en mémoire que ce chemin et ces frères."
03-lia-qui-cherche-08 = "Recherche à coût uniforme. Chaque ville porte son coût cumulé depuis Dakar : Dakar 0, Rufisque 30, Mbour 80, Thiès 80, Louga 200, Diourbel 210, Saint-Louis 270. Le chemin de moindre coût, en vert épais, passe par Rufisque, Thiès et Louga."
03-lia-qui-cherche-09 = "La même carte, chaque ville portant cette fois son heuristique, l'estimation à vol d'oiseau de ce qui la sépare de Saint-Louis : Dakar 250, Rufisque 240, Mbour 250, Thiès 190, Diourbel 160, Louga 70, Saint-Louis 0."
03-lia-qui-cherche-10 = "A* sur la carte. Chaque ville du chemin porte son évaluation, coût parcouru plus heuristique : Dakar 0 plus 250 égale 250 ; Rufisque 30 plus 240 égale 270 ; Thiès 80 plus 190 égale 270 ; Louga 200 plus 70 égale 270 ; Saint-Louis 270 plus 0 égale 270. Mbour et Diourbel restent gris, jamais développés : A* trouve le chemin optimal sans explorer toute la carte."
03-lia-qui-cherche-11 = "Tableau comparatif des cinq stratégies. En haut, les recherches non informées : BFS, niveau par niveau, complet mais non optimal ; DFS, en profondeur, économe en mémoire mais non complet ; UCS, à coût croissant, complet et optimal. En bas, les recherches informées : Greedy, qui suit l'heuristique, rapide mais non optimal, et A*, qui somme le coût parcouru et l'heuristique, optimal et efficace, seul encadré en gras. Deux flèches convergent vers A* : « plus une heuristique » depuis UCS, « plus le coût parcouru » depuis Greedy."
