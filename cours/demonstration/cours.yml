# Métadonnées du cours (US-14) : seule source pour la fiche de la page d'accueil du cours et pour la
# carte du catalogue (enseignement/index.qmd). Un cours décrit ici n'est pas répété dans
# enseignement/cours.yml.
#
# Champs :
#   titre       intitulé du cours ; doit être identique au « title » de index.qmd (le rendu échoue sinon) ;
#   domaine     groupe de cartes du catalogue ;
#   niveaux     niveaux où le cours est proposé ;
#   semestre    semestre d'enseignement ;
#   prerequis   liste, affichée sur la page du cours ;
#   objectifs   liste, affichée sur la page du cours ;
#   statut      « en-ligne » (carte liée à la page du cours) ou « a-venir » (badge, sans lien) ;
#   skill       (facultatif, jamais affiché) skill Claude associé au cours.

titre: "Cours de démonstration"
domaine: "Démonstration"
niveaux: ["L3", "M1"]
semestre: "S1"
statut: "en-ligne"
prerequis:
  - "Aucun : ce cours ne sert qu'à valider le gabarit."
objectifs:
  - "Montrer la structure d'un cours : page de présentation, chapitres numérotés, fiche et plan."
  - "Vérifier la navigation : barre latérale du cours, liens précédent/suivant, table des matières."
  - "Servir de modèle au premier cours réel (US-16)."
