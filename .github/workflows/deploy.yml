name: Déploiement

on:
  push:
    branches: [main]

# Permission minimale : pousser le site rendu sur la branche gh-pages.
permissions:
  contents: write

# Les déploiements s'enchaînent sans s'annuler : le dernier merge est toujours publié.
concurrency:
  group: deploiement
  cancel-in-progress: false

env:
  # Mêmes versions que la CI (ci.yml).
  QUARTO_VERSION: "1.10.18"
  PYTHON_VERSION: "3.12"

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Seuls les scripts de vérification ont besoin de Python, et ils n'utilisent que la bibliothèque
      # standard. Les dépendances de requirements.txt ne sont pas installées : les résultats d'exécution
      # sont gelés dans _freeze/ (US-18). Sans elles, un gel oublié fait échouer le rendu au lieu de
      # passer inaperçu en réexécutant le code.
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Outils Node : ils impriment les PDF des séances pendant le rendu (US-17).
      - name: Installer les outils Node
        run: npm ci --no-audit --no-fund

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      # Site bilingue (US-36) : le rendu passe par le script (un profil par langue, puis assemblage),
      # et la publication se contente de mettre _site/ en ligne.
      - name: Rendre le site (français et anglais)
        run: python scripts/rendre.py

      - name: Publier sur gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
