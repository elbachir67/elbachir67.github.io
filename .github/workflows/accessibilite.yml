name: Accessibilité — audit complet

# Le second régime d'US-63. Sur une PR, l'audit ne porte que sur les pages touchées : c'est rapide,
# et cela suffit à empêcher qu'un défaut entre. Mais un défaut peut apparaître sans qu'aucune page
# ne change — une règle de style qui s'applique ailleurs qu'où on l'attendait, un thème mis à jour,
# une extension Quarto qui évolue. L'audit complet est ce qui rattrape ces cas-là.
#
# Il tourne donc **sur `main`, une fois par semaine**, et son échec ouvre une issue : personne ne
# lit les journaux d'un job programmé, tout le monde voit une issue.

on:
  schedule:
    # Lundi 5 h UTC : le résultat attend le PO au début de sa semaine.
    - cron: "0 5 * * 1"
  # Pour le lancer à la main après un changement de thème ou de version de Quarto.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: accessibilite-complete
  cancel-in-progress: false

env:
  QUARTO_VERSION: "1.10.18"
  PYTHON_VERSION: "3.12"

jobs:
  audit-complet:
    runs-on: ubuntu-latest
    # L'audit complet dure vingt-quatre minutes à cinq cours, le rendu trois. La marge tient
    # compte des cours à venir : c'est ici, et non sur la PR, que le temps peut s'allonger.
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les outils Node
        run: npm ci --no-audit --no-fund

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Rendre le site
        run: python scripts/rendre.py

      - name: Auditer tout le site
        id: audit
        run: node scripts/verifier_accessibilite.js _site | tee accessibilite.txt

      - name: Ouvrir une issue si l'audit a trouvé quelque chose
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const rapport = fs.existsSync("accessibilite.txt")
              ? fs.readFileSync("accessibilite.txt", "utf8").slice(0, 55000)
              : "Le rapport n'a pas été produit : voir le journal du job.";
            const jour = new Date().toISOString().slice(0, 10);
            const titre = `Accessibilité : l'audit complet du ${jour} a trouvé des violations`;
            const corps = [
              "L'audit hebdomadaire de `main` a échoué. Il examine chaque page et chaque slide en",
              "deux langues, deux thèmes et deux largeurs — ce que l'audit d'une PR ne fait pas,",
              "puisqu'il se limite aux pages touchées (US-63).",
              "",
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```",
              rapport,
              "```",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titre,
              body: corps,
              labels: ["type:bug", "prio:M"],
            });
