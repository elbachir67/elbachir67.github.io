name: CI

on:
  # Toutes les PR, quelle que soit leur branche cible : quand les séances d'un cours s'enchaînent,
  # chaque PR part de la précédente et non de « main » — sans cela, elle ne serait pas vérifiée.
  pull_request:

permissions:
  contents: read

# Un nouveau push sur la PR annule la vérification en cours.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Version de référence, à utiliser aussi en local (README) pour un rendu identique.
  QUARTO_VERSION: "1.10.18"
  PYTHON_VERSION: "3.12"

jobs:
  # Ce nom de job est le check obligatoire de la protection de main.
  rendu-et-liens:
    runs-on: ubuntu-latest
    # Le contrôle d'accessibilité examine chaque page et chaque slide dans les deux langues, les deux
    # thèmes et deux largeurs : avec l'arrivée du cours de ML, cela fait 2102 combinaisons et une
    # douzaine de minutes à lui seul. Les quinze minutes d'origine le coupaient en plein vol, et le
    # job était rapporté comme un échec. Le seuil laisse la place à un cours de plus.
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Seuls les scripts de vérification ont besoin de Python, et ils n'utilisent que la bibliothèque
      # standard. Les dépendances de requirements.txt ne sont pas installées : les résultats d'exécution
      # sont gelés dans _freeze/ (US-18). Sans elles, un gel oublié fait échouer le rendu au lieu de
      # passer inaperçu en réexécutant le code.
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Outils Node : ils impriment les PDF des séances pendant le rendu (US-17) et font l'audit
      # d'accessibilité plus bas (US-42). Le navigateur est le Chrome déjà installé sur la machine :
      # aucun navigateur n'est téléchargé.
      - name: Installer les outils Node
        run: npm ci --no-audit --no-fund

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      # quarto render sort avec le code 0 malgré ses avertissements (DoD : aucun avertissement).
      # Ses messages sont colorés même hors terminal : on retire les codes ANSI avant de chercher WARN.
      # Site bilingue (US-36) : un rendu par langue, puis assemblage dans _site/ (ADR-0003).
      - name: Rendre le site
        id: rendu
        shell: bash
        run: |
          python scripts/rendre.py 2>&1 | tee "$RUNNER_TEMP/rendu.log"
          avertissements=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/rendu.log" | grep -E '^WARN(ING)?[: (]' || true)
          if [ -n "$avertissements" ]; then
            while IFS= read -r ligne; do
              echo "::error title=Avertissement de quarto render::$ligne"
            done <<< "$avertissements"
            exit 1
          fi

      # Aucun numéro de téléphone publié (US-10, CLAUDE.md §7), y compris dans les PDF.
      # pdftotext (poppler) extrait le texte des PDF ; il est installé seulement s'il manque sur le runner.
      - name: Vérifier l'absence de numéro de téléphone
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          python scripts/verifier_telephone.py _site

      # Un identifiant ne paraît qu'une fois par page (US-59), SVG incorporés compris. Deux figures
      # d'une même page définissaient les mêmes identifiants de glyphes, et toutes les lettres des
      # figures suivantes venaient de la première.
      - name: Vérifier l'unicité des identifiants
        run: python scripts/verifier_identifiants.py _site

      # Rien de non publiable dans le site (US-59) : documents réservés à l'enseignant — repérés par
      # leur nom de fichier, et par les liens qui y mènent — et termes que le PO ne veut pas voir
      # publiés. La correction se fait à la source, puis l'import est rejoué.
      - name: Vérifier que rien de non publiable n'est en ligne
        run: python scripts/verifier_non_publiable.py _site

      # Email protégé (US-12) : l'adresse de _quarto.yml ne doit apparaître nulle part dans _site/, ni en clair,
      # ni encodée (URL, entités HTML), et aucun lien mailto ne doit être écrit en dur dans une page.
      - name: Vérifier que l'email n'apparaît pas en clair
        run: |
          utilisateur=$(sed -n 's/^  email-utilisateur: "\(.*\)"$/\1/p' _quarto.yml)
          domaine=$(sed -n 's/^  email-domaine: "\(.*\)"$/\1/p' _quarto.yml)
          if [ -z "$utilisateur" ] || [ -z "$domaine" ]; then
            echo "::error title=Email protégé::contact.email-utilisateur ou contact.email-domaine introuvable dans _quarto.yml"
            exit 1
          fi
          if grep -rIlF \
              -e "${utilisateur}@${domaine}" -e "${utilisateur}%40${domaine}" \
              -e "${utilisateur}&#64;${domaine}" -e "${utilisateur}&#x40;${domaine}" -e "${utilisateur}&commat;${domaine}" \
              -e 'href="mailto:' _site; then
            echo "::error title=Email en clair::adresse ou lien mailto statique dans les fichiers listés ci-dessus"
            exit 1
          fi
          echo "OK : ni adresse en clair ni lien mailto statique dans _site/."

      # Liens internes : vérification hors ligne des fichiers de _site/. Un lien cassé fait échouer la CI.
      - name: Vérifier les liens internes
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/_site
            '_site/**/*.html'
          fail: true
          output: lychee/liens-internes.md

      # Ce que le site promet, il doit le servir (US-65) : un dossier de cours promet une page
      # d'accueil, un lien interne promet une page, une ressource du manifeste promet un fichier.
      # Le contrôle ci-dessus ne suffit pas : lychee tient un **dossier existant** pour une cible
      # valide, et `cours/structures-de-donnees/` existait — sans `index.html`. Le cours est parti
      # en ligne en 404, la CI au vert.
      - name: Vérifier que le site sert ce qu'il promet
        run: python scripts/verifier_publication.py _site

      # Site bilingue (US-36) : équivalents FR/EN et hreflang réciproques.
      - name: Vérifier la cohérence bilingue
        run: python scripts/verifier_bilingue.py _site

      # Référencement (US-13) : titre et description uniques par page, métadonnées de partage,
      # sitemap.xml et robots.txt.
      - name: Vérifier le référencement
        run: python scripts/verifier_metadonnees.py _site

      # Cours (US-41) : la page publiée doit être exactement ce que produit l'import de ses sources, et
      # tout bloc exécutable doit avoir son résultat gelé — la CI n'exécute aucun code Python.
      - name: Vérifier la conversion des cours
        run: python scripts/verifier_conversion.py

      # Cours (US-54) : une figure publiée vide est un défaut silencieux — la page se rend, les liens
      # sont bons, et l'étudiant voit un cadre blanc.
      - name: Vérifier qu'aucune figure n'est vide
        run: python scripts/verifier_figures.py

      # Cours (US-51) : un « \\[2pt] » non converti s'afficherait en clair sur une slide. Le rapport
      # de conversion ne voit que ce que le script sait ignorer ; ce contrôle regarde le résultat.
      - name: Vérifier qu'aucun reste de LaTeX n'a traversé
        run: python scripts/verifier_latex.py

      - name: Vérifier l'accessibilité
        run: node scripts/verifier_accessibilite.js _site

      # Cours (US-43) : une slide trop chargée ne se voit pas au rendu — revealjs la laisse défiler,
      # et l'enseignant la découvre en amphi.
      - name: Vérifier qu'aucune slide ne déborde
        run: node scripts/verifier_debordement.js _site

      # Les présentations chargent MathJax par un détournement de la variable globale que Quarto
      # expose : si Quarto change, elles perdraient leurs formules sans un mot (US-61).
      - name: Vérifier que les formules sont composées
        run: node scripts/verifier_formules.js _site

      # Liens externes : un lien cassé produit un avertissement, sans faire échouer la CI.
      - name: Vérifier les liens externes
        id: externes
        if: ${{ !cancelled() && steps.rendu.outcome == 'success' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --scheme https --scheme http
            '_site/**/*.html'
          fail: false
          failIfEmpty: false
          output: lychee/liens-externes.md

      - name: Signaler les liens externes cassés
        if: ${{ !cancelled() && steps.externes.outcome == 'success' && steps.externes.outputs.exit_code != '0' }}
        run: echo "::warning title=Liens externes cassés::Voir le détail dans le résumé du job (section lychee)."
