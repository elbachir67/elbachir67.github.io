version: 2
updates:
  # Actions GitHub uniquement. La version de Quarto est montée par une story dédiée, pas par Dependabot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Toutes les mises à jour du mois dans une seule PR.
    groups:
      actions-github:
        patterns: ["*"]
    commit-message:
      prefix: ci
    # Labels existants : évite que Dependabot recrée ses labels par défaut.
    labels: ["type:ci", "epic:EP1"]
