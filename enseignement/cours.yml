#   statut   « a-venir » (carte « Bientôt en ligne », sans lien) ou « en-ligne » (carte liée à « lien ») ;
#   lien     (en-ligne) chemin de la page du cours, par exemple ../cours/slug/index.qmd ;
#   skill    (facultatif, jamais affiché) skill Claude associé au cours.

