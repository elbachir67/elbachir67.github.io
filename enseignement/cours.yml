# Repris de la section « Enseignements » de _specs/contenus/sprint-02-sources.md. Niveaux indicatifs.
# Ajouter un cours = ajouter une entrée ci-dessous, sans toucher à index.qmd (voir README.md).
#
# Champs d'un cours :
#   titre          intitulé du cours ;
#   domaine        groupe de cartes, dans l'ordre de première apparition dans ce fichier ;
#   niveaux        liste des niveaux (L1… M1, avec la filière éventuelle) ;
#   etablissement  établissement où le cours est donné ;
#   statut         « a-venir » (carte « Bientôt en ligne », sans lien) ou « en-ligne » (carte liée à « lien ») ;
#   lien           (en-ligne) chemin de la page du cours, par exemple ../cours/slug/index.qmd.

