# Catalogue des cours (US-11) : seule source de la page enseignement/index.qmd.
#
# Contenu fourni par le PO dans la PR #35 (remplace la liste initiale des sources du Sprint 2).
# Ajouter un cours = ajouter une entrée ci-dessous, sans toucher à index.qmd (voir README.md).
#
# Champs d'un cours :
#   titre    intitulé du cours ;
#   domaine  groupe de cartes, dans l'ordre de première apparition dans ce fichier ;
#   niveaux  liste des niveaux où le cours est proposé (contenu adapté à chaque niveau) ;
#   statut   « a-venir » : carte « Bientôt en ligne », sans lien. Un cours publié quitte ce fichier :
#            ses métadonnées passent dans cours/<slug>/cours.yml, et le catalogue les lit (US-14) ;
#   skill    (facultatif, jamais affiché) skill Claude associé au cours.

